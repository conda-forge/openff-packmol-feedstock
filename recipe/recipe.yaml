context:
  name: openff-packmol
  version: "0.1.post1"
  python_min: "3.11"

package:
  name: openff-packmol
  version: ${{ version }}

source:
  url: https://github.com/openforcefield/${{ name }}/archive/refs/tags/${{ version }}.tar.gz
  sha256: ff8feb7969f2f929753f2ca965bf7c79debcda4fd0752bc3dc80b70de30c6dc7

build:
  noarch: python
  script: SETUPTOOLS_SCM_PRETEND_VERSION="$PKG_VERSION" ${PYTHON} -m pip install . -vv --no-deps
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - setuptools_scm
  run:
    - python >=${{ python_min }}
    - numpy
    - scipy
    - packaging
    - openff-toolkit-base >=0.18  # note to self: could probably drop down to 0.17.x if needed
  run_constraints:
    - packmol <100
    - openff-units >=0.3.0  # solver sometimes goes to ancient verisons like 0.1.8

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - python test_version.py
      - python test_pack.py
    requirements:
      run:
        - packmol
        - rdkit
    files:
      recipe:
        - test_version.py
        - test_pack.py

about:
  homepage: https://github.com/openforcefield/openff-packmol
  summary: 'A Packmol wrapper using OpenFF objects'
  description: 'A Packmol wrapper using OpenFF objects'
  license: MIT
  license_file: LICENSE
  repository: https://github.com/openforcefield/openff-packmol

extra:
  recipe-maintainers:
    - j-wags
    - mattwthompson
